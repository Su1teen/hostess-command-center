name: Dine-in checks
on:
  push:
    branches: [main, feat/xoxo-qr-dining-loyalty]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostess_test
          POSTGRES_PASSWORD: hostess_test
          POSTGRES_DB: hostess_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hostess_test:hostess_test@127.0.0.1:5432/hostess_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-operations-browser-evidence
          path: |
            test-results/*.png
            test-results/*.pdf
